[project]
name = "laboratorio1-ia"
version = "0.1.0"
description = "Desarrollo del Laboratorio 1 de Inteligencia Artificial para la Universidad César Vallejo"
authors = [
    {name = "Giancarlos Alexander Pillco Castro"}
]
requires-python = ">=3.14"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
